name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.20.14"

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 校验 tag 与源码版本号一致
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $src = (Select-String -Path internal/core/config.go -Pattern '^const Version = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag source=$src"
          if ($tag -ne $src) { throw "tag 与 internal/core/config.go 的 Version 不一致" }
      - name: 依赖准入
        run: go run ./cmd/depguard
      - name: 代码卫生门禁
        run: python3 scripts/check.py
      - name: 安装 rsrc（图标资源编译器）
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 安装 Inno Setup 6.7.x
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - name: 构建完整 Windows 包（双架构 + 安装包）
        # v2.0 默认更新源是 GitHub Releases + SHA256SUMS；签名清单为可选增强。
        # 没有配置 UPDATE_PUBKEY 时不再强制失败，避免 Release 被密钥卡住。
        env:
          UPDATE_PUBKEY: ${{ secrets.UPDATE_PUBKEY }}
          REQUIRE_SIGNED: "1"
        run: powershell -ExecutionPolicy Bypass -File build\build-release.ps1 -Test
      - name: 打包 ZIP
        shell: pwsh
        run: |
          $version = (Select-String -Path internal/core/config.go -Pattern '^const Version = "([^"]+)"').Matches[0].Groups[1].Value
          $zip = "dist/WIN7Harness-v$version-win7.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $files = Get-ChildItem dist -File | Where-Object {
            $_.Name -ne (Split-Path $zip -Leaf) -and $_.Name -ne "SHA256SUMS.txt" -and $_.Name -ne "latest.json"
          }
          Compress-Archive -Path $files.FullName -DestinationPath $zip -CompressionLevel Optimal
      - name: 生成更新清单（Ed25519 签名）
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
          REQUIRE_SIGNED: "1"
        run: |
          $version = (Select-String -Path internal/core/config.go -Pattern '^const Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:UPDATE_PRIVATE_KEY) {
            go run ./tools/make_manifest -version $version -out dist/latest.json -key-from-env UPDATE_PRIVATE_KEY -dist dist
          } elseif ($env:REQUIRE_SIGNED -eq "1") {
            throw "REQUIRE_SIGNED=1 但缺少 UPDATE_PRIVATE_KEY：拒绝生成未签名 latest.json"
          } else {
            $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version"
            $files = @{}
            foreach ($arch in @("amd64", "386")) {
              $name = "WIN7Harness-$arch.exe"
              $sum = (Get-FileHash (Join-Path "dist" $name) -Algorithm SHA256).Hash.ToLower()
              $files[$arch] = @{ url = "$base/$name"; sha256 = $sum }
            }
            $manifest = @{ version = $version; files = $files; page_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$version" }
            [IO.File]::WriteAllText((Join-Path (Get-Location) "dist\latest.json"), ($manifest | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding($false)))
          }
      - name: 生成校验和
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) "dist\SHA256SUMS.txt"), ($lines -join "`n") + "`n", (New-Object Text.UTF8Encoding($false)))
          Get-Content dist\SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WIN7Harness-v*-win7.zip
            dist/WIN7Harness-amd64.exe
            dist/WIN7Harness-386.exe
            dist/latest.json
            dist/SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
