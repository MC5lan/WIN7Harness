name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.20.14"

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: 校验 tag 与源码版本号一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/core/config.go)
          echo "tag=$TAG source=$SRC"
          test "$TAG" = "$SRC" || { echo "tag 与 internal/core/config.go 的 Version 不一致"; exit 1; }
      - name: 依赖准入
        run: go run ./cmd/depguard
      - name: 安装 rsrc（图标资源编译器）
        # build.sh 的交叉编译段需要 rsrc 把 ico 嵌进 PE；runner 默认没有。
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: 构建（跳过图标生成）
        env:
          SKIP_ICON: "1"
          UPDATE_PUBKEY: ${{ secrets.UPDATE_PUBKEY }}
          REQUIRE_SIGNED: "1"
          OUT_DIR: dist
        run: ./build.sh
      - name: 生成更新清单
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          go run ./tools/make_manifest \
            -version "${GITHUB_REF_NAME#v}" \
            -out dist/latest.json \
            -key-from-env UPDATE_PRIVATE_KEY \
            -dist dist
      - name: 生成校验和
        run: cd dist && sha256sum *.exe *.zip latest.json > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WIN7Harness-v*-win7.zip
            dist/latest.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
